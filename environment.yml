name: neuroim
channels:
  - conda-forge
dependencies:
  - python=3.10
  - nibabel>=5.3
  - pandas>=2.2
  - pybids>=0.19
  - bids-validator>=1.14  # note: conda-forge's "bids-validator" is the Python
                          # rules library (used internally by pybids), NOT the
                          # CLI tool -- that comes from npm, installed below
  - dcm2niix
  - nodejs>=18
